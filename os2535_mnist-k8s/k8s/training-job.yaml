
apiVersion: batch/v1
kind: Job
metadata:
  name: mnist-training
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: us-central1-docker.pkg.dev/os2535-mnist-kubernetes-hw4/mnist-repo/trainer:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_DIR
              value: /models
            - name: EPOCHS
              value: "3"
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: mnist-model-pvc
